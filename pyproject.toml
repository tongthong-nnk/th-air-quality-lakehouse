[project]
name = "th-air-quality-lakehouse"
version = "1.0.0"
description = "Serverless AWS lakehouse for PM2.5 from Thailand's government air quality stations"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src/ingest", "src/glue", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src/ingest", "src/glue", "scripts"]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
